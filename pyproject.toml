[project]
name = "magicnet"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
magicnet = "magicnet:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]
